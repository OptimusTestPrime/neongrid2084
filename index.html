<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Grid 2084</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; color: #fff;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden; touch-action: none; user-select: none;
        }

        #gameCanvas {
            display: block; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* CRT Scanline Overlay */
        #crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none; z-index: 10; opacity: 0.6; mix-blend-mode: overlay;
        }

        #crt-flicker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.02);
            opacity: 0; pointer-events: none; z-index: 11;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.01; } 50% { opacity: 0.04; } 100% { opacity: 0.02; }
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; pointer-events: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .screen {
            display: none; flex-direction: column; align-items: center;
            background: rgba(0, 0, 0, 0.85); padding: 2rem;
            border: 4px solid #0ff; box-shadow: 0 0 20px #0ff, inset 0 0 20px #0ff;
            border-radius: 10px; pointer-events: auto; text-align: center;
            max-width: 90vw; max-height: 90vh; overflow-y: auto;
        }
        .screen.active { display: flex; }

        h1 {
            color: #f0f; text-shadow: 0 0 10px #f0f, 0 0 20px #f0f;
            margin-bottom: 1.5rem; font-size: clamp(1.2rem, 4vw, 2.5rem); line-height: 1.5;
        }

        button {
            background: transparent; color: #0f0; border: 2px solid #0f0;
            padding: 1rem 1.5rem; font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.7rem, 2vw, 1rem); cursor: pointer; margin-top: 1rem;
            transition: all 0.2s; text-shadow: 0 0 5px #0f0; box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            width: 100%; max-width: 300px;
        }
        button:hover { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }

        .btn-alt {
            border-color: #f0f; color: #f0f; text-shadow: 0 0 5px #f0f; box-shadow: 0 0 10px rgba(255,0,255,0.5);
        }
        .btn-alt:hover { background: #f0f; color: #000; box-shadow: 0 0 20px #f0f; }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; z-index: 5; pointer-events: none;
            color: #0ff; text-shadow: 0 0 10px #0ff; font-size: clamp(0.7rem, 2vw, 1rem);
        }

        .glow-text-magenta { color: #f0f; text-shadow: 0 0 10px #f0f; }
        .glow-text-green { color: #0f0; text-shadow: 0 0 10px #0f0; }
        
        #initials-input {
            background: #000; border: 2px solid #0ff; color: #0ff;
            font-family: 'Press Start 2P', cursive; font-size: 2rem;
            text-align: center; width: 150px; padding: 10px;
            text-transform: uppercase; outline: none; margin: 20px 0;
            box-shadow: 0 0 10px #0ff; pointer-events: auto;
        }

        #leaderboard-list {
            list-style: none; padding: 0; width: 100%; min-width: 280px; max-width: 400px;
            text-align: left; margin-top: 10px; margin-bottom: 10px;
        }
        #leaderboard-list li {
            display: flex; justify-content: space-between; margin-bottom: 15px;
            font-size: 0.8rem; color: #fff; text-shadow: 0 0 5px #fff;
        }
        #leaderboard-list li .rank { color: #f0f; width: 15%; }
        #leaderboard-list li .name { color: #0ff; width: 40%; text-align: left; }
        #leaderboard-list li .score { color: #0f0; width: 45%; text-align: right; }

        .hidden { display: none !important; }
        .loader {
            border: 4px solid #000; border-top: 4px solid #0ff; border-radius: 50%;
            width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #wave-announcement {
            position: absolute; top: 40%; left: 0; width: 100%;
            text-align: center; font-size: clamp(2rem, 5vw, 4rem);
            pointer-events: none; z-index: 25; display: none;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.7; transform: scale(1); } to { opacity: 1; transform: scale(1.1); } }
    </style>
</head>
<body>
    <div id="crt-overlay"></div>
    <div id="crt-flicker"></div>
    
    <div id="hud" class="hidden">
        <div>SCORE: <br><span id="score-display">0</span></div>
        <div style="text-align:center;">WAVE: <br><span id="wave-display" class="glow-text-magenta">1</span></div>
        <div style="text-align:right;">LIVES: <br><span id="lives-display" class="glow-text-green">3</span></div>
    </div>

    <div id="wave-announcement" class="glow-text-magenta">WAVE 1</div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- Start Screen -->
        <div id="screen-start" class="screen active">
            <h1>NEON GRID<br>2084</h1>
            <p style="font-size: 0.6rem; line-height: 1.8; color: #aaa; max-width: 300px; margin-bottom: 10px;">
                <span class="glow-text-magenta">DESKTOP:</span> WASD Move, Arrows Shoot<br><br>
                <span class="glow-text-green">MOBILE:</span> Touch left side to move, right side to shoot.
            </p>
            <button id="btn-start">INSERT COIN</button>
            <button id="btn-show-leaderboard" class="btn-alt">HIGH SCORES</button>
        </div>

        <!-- Game Over Screen -->
        <div id="screen-gameover" class="screen">
            <h1 class="glow-text-magenta">GAME OVER</h1>
            <p style="font-size: 0.8rem; margin-bottom: 0.5rem;">FINAL SCORE: <span id="final-score" class="glow-text-green">0</span></p>
            <p style="font-size: 0.8rem;">WAVE REACHED: <span id="final-wave" class="glow-text-magenta">1</span></p>
            
            <div id="name-entry-section" class="mt-6">
                <p style="font-size: 0.8rem; color: #0ff;">ENTER INITIALS:</p>
                <input type="text" id="initials-input" maxlength="3" autocomplete="off" spellcheck="false" placeholder="AAA">
                <button id="btn-submit-score">SUBMIT SCORE</button>
            </div>
            <div id="submitting-loader" class="hidden">
                <div class="loader"></div>
                <p style="font-size: 0.6rem; color: #0ff;">SAVING TO DATABANK...</p>
            </div>
        </div>

        <!-- Leaderboard Screen -->
        <div id="screen-leaderboard" class="screen">
            <h1 class="glow-text-green">DATABANK</h1>
            <div id="leaderboard-loading" class="loader"></div>
            <ul id="leaderboard-list"></ul>
            <button id="btn-back-main">MAIN MENU</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State & Config
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'neon-grid-2084';
        
        let db = null;
        let auth = null;
        let isFirebaseReady = false;
        
        // Default high scores if DB is empty or fails
        let cachedHighScores = [
            { name: 'RTP', score: 50000, wave: 15 },
            { name: 'NEO', score: 25000, wave: 10 },
            { name: 'CPU', score: 10000, wave: 5 },
            { name: 'HAL', score: 5000, wave: 3 },
            { name: 'BOT', score: 2500, wave: 2 }
        ];

        async function initFirebase() {
            try {
                if (typeof __firebase_config === 'undefined') throw new Error("No config");
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                isFirebaseReady = true;
                await fetchHighScores();
            } catch (error) {
                console.log("Running in offline mode. Firebase init skipped.");
            }
        }

        async function fetchHighScores() {
            if (!isFirebaseReady || !auth.currentUser) return cachedHighScores;
            try {
                // RULE 1: Strict Paths
                const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'highscores');
                // RULE 2: No Complex Queries (Fetch all, sort in memory)
                const snapshot = await getDocs(scoresRef);
                
                let scores = [];
                snapshot.forEach(doc => scores.push(doc.data()));
                
                if (scores.length > 0) {
                    scores.sort((a, b) => b.score - a.score);
                    cachedHighScores = scores.slice(0, 10);
                }
                return cachedHighScores;
            } catch (error) {
                console.error("Fetch error:", error);
                return cachedHighScores;
            }
        }

        async function saveHighScore(name, score, wave) {
            const entry = { name: name.toUpperCase(), score: score, wave: wave, timestamp: Date.now() };
            if (!isFirebaseReady || !auth.currentUser) {
                cachedHighScores.push(entry);
                cachedHighScores.sort((a, b) => b.score - a.score);
                cachedHighScores = cachedHighScores.slice(0, 10);
                return;
            }
            try {
                const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'highscores');
                await addDoc(scoresRef, entry);
                await fetchHighScores(); 
            } catch (error) {
                console.error("Save error:", error);
            }
        }

        initFirebase();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2, LEADERBOARD: 3 };
        let currentState = STATE.MENU;
        let lastTime = performance.now();
        let animationFrameId;

        let score = 0;
        let lives = 3;
        let currentWave = 1;

        let player;
        let bullets = [];
        let enemies = [];
        let particles = [];
        
        let waveActive = false;
        let enemiesToSpawn = 0;
        let spawnCooldown = 0;
        
        let isWaveTransition = false;
        let waveTimer = 0;
        let isRespawning = false;
        let respawnTimer = 0;

        let synth, noiseSynth;

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        const joysticks = {
            left: { active: false, id: null, ox: 0, oy: 0, cx: 0, cy: 0, dx: 0, dy: 0 },
            right: { active: false, id: null, ox: 0, oy: 0, cx: 0, cy: 0, dx: 0, dy: 0 }
        };
        const MAX_JOY_RADIUS = 40;

        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Touch event handlers for virtual joysticks
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (currentState !== STATE.PLAYING) return;
            Array.from(e.changedTouches).forEach(touch => {
                const isLeft = touch.clientX < width / 2;
                const stick = isLeft ? joysticks.left : joysticks.right;
                if (!stick.active) {
                    stick.active = true;
                    stick.id = touch.identifier;
                    stick.ox = stick.cx = touch.clientX;
                    stick.oy = stick.cy = touch.clientY;
                    updateJoyVector(stick);
                }
            });
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (currentState !== STATE.PLAYING) return;
            Array.from(e.changedTouches).forEach(touch => {
                if (joysticks.left.active && touch.identifier === joysticks.left.id) {
                    joysticks.left.cx = touch.clientX; joysticks.left.cy = touch.clientY;
                    updateJoyVector(joysticks.left);
                }
                if (joysticks.right.active && touch.identifier === joysticks.right.id) {
                    joysticks.right.cx = touch.clientX; joysticks.right.cy = touch.clientY;
                    updateJoyVector(joysticks.right);
                }
            });
        }, { passive: false });

        const endTouch = (e) => {
            e.preventDefault();
            Array.from(e.changedTouches).forEach(touch => {
                if (joysticks.left.active && touch.identifier === joysticks.left.id) {
                    joysticks.left.active = false; joysticks.left.dx = 0; joysticks.left.dy = 0;
                }
                if (joysticks.right.active && touch.identifier === joysticks.right.id) {
                    joysticks.right.active = false; joysticks.right.dx = 0; joysticks.right.dy = 0;
                }
            });
        };
        canvas.addEventListener('touchend', endTouch);
        canvas.addEventListener('touchcancel', endTouch);

        function updateJoyVector(stick) {
            let dx = stick.cx - stick.ox;
            let dy = stick.cy - stick.oy;
            const dist = Math.hypot(dx, dy);
            if (dist > MAX_JOY_RADIUS) {
                dx = (dx / dist) * MAX_JOY_RADIUS;
                dy = (dy / dist) * MAX_JOY_RADIUS;
            }
            stick.dx = dx / MAX_JOY_RADIUS; 
            stick.dy = dy / MAX_JOY_RADIUS;
        }

        function initAudio() {
            if (synth) return;
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "square" },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0.0, release: 0.1 }
            }).toDestination();
            synth.volume.value = -12;

            noiseSynth = new Tone.NoiseSynth({
                noise: { type: "white" },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0 }
            }).toDestination();
            noiseSynth.volume.value = -15;
        }

        function playSound(type) {
            if (!synth) return;
            try {
                if (type === 'shoot') synth.triggerAttackRelease("C6", "32n");
                else if (type === 'hit') noiseSynth.triggerAttackRelease("32n");
                else if (type === 'explosion') noiseSynth.triggerAttackRelease("8n");
                else if (type === 'waveStart') synth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "4n");
                else if (type === 'playerDeath') synth.triggerAttackRelease(["C3", "F#2", "C2"], "2n");
                else if (type === 'gameOver') synth.triggerAttackRelease(["C3", "G2", "C2"], "1n");
            } catch(e) {}
        }

        class Player {
            constructor() {
                this.x = width / 2;
                this.y = height / 2;
                this.radius = 12;
                this.speed = 220; 
                this.color = '#0ff';
                this.shootTimer = 0;
                this.shootRate = 0.12; 
                this.invuln = 2.0; 
            }

            update(dt) {
                if (this.invuln > 0) this.invuln -= dt;

                // Move Logic
                let mx = 0, my = 0;
                if (keys.w) my -= 1; if (keys.s) my += 1;
                if (keys.a) mx -= 1; if (keys.d) mx += 1;

                if (mx === 0 && my === 0 && joysticks.left.active) {
                    mx = joysticks.left.dx; my = joysticks.left.dy;
                } else if (mx !== 0 || my !== 0) {
                    const len = Math.hypot(mx, my); mx /= len; my /= len;
                }

                this.x = Math.max(this.radius, Math.min(width - this.radius, this.x + mx * this.speed * dt));
                this.y = Math.max(this.radius, Math.min(height - this.radius, this.y + my * this.speed * dt));

                // Shoot Logic
                this.shootTimer -= dt;
                if (this.shootTimer <= 0) {
                    let sx = 0, sy = 0;
                    if (keys.ArrowUp) sy -= 1; if (keys.ArrowDown) sy += 1;
                    if (keys.ArrowLeft) sx -= 1; if (keys.ArrowRight) sx += 1;

                    if (sx !== 0 || sy !== 0) {
                        const len = Math.hypot(sx, sy); sx /= len; sy /= len;
                    } else if (joysticks.right.active && Math.hypot(joysticks.right.dx, joysticks.right.dy) > 0.25) {
                         sx = joysticks.right.dx; sy = joysticks.right.dy;
                         const len = Math.hypot(sx, sy); sx /= len; sy /= len;
                    }

                    if (sx !== 0 || sy !== 0) {
                        bullets.push(new Bullet(this.x, this.y, sx, sy));
                        this.shootTimer = this.shootRate;
                        playSound('shoot');
                    }
                }
            }

            draw(ctx) {
                if (this.invuln > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color; ctx.lineWidth = 2.5;
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                
                ctx.beginPath();
                ctx.moveTo(0, -this.radius);
                ctx.lineTo(this.radius, this.radius);
                ctx.lineTo(0, this.radius - 4);
                ctx.lineTo(-this.radius, this.radius);
                ctx.closePath();
                ctx.stroke();
                
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 5;
                ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, dx, dy) {
                this.x = x; this.y = y;
                this.vx = dx * 600; this.vy = dy * 600;
                this.radius = 4; this.life = 1.5;
            }
            update(dt) {
                this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt;
            }
            draw(ctx) {
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 8; ctx.shadowColor = '#ff0';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color, speedScale) {
                this.x = x; this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 80 + 40) * speedScale;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.life = Math.random() * 0.4 + 0.2; this.maxLife = this.life;
                this.color = color; this.size = Math.random() * 3 + 1;
            }
            update(dt) {
                this.x += this.vx * dt; this.y += this.vy * dt;
                this.life -= dt; this.size = Math.max(0, this.size - dt * 5);
            }
            draw(ctx) {
                ctx.fillStyle = this.color; ctx.globalAlpha = this.life / this.maxLife;
                ctx.shadowBlur = 5; ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        function createParticles(x, y, count, color, speedScale=1) {
            for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color, speedScale));
        }

        class Enemy {
            constructor(type, x, y) {
                this.x = x; this.y = y;
                this.type = type; this.dead = false;

                if (type === 'grunt') {
                    this.color = '#f0f'; this.speed = 70 + Math.random() * 30;
                    this.radius = 12; this.hp = 1; this.score = 100;
                } else if (type === 'speedy') {
                    this.color = '#f00'; this.speed = 180 + Math.random() * 40;
                    this.radius = 8; this.hp = 1; this.score = 250;
                    this.erraticTimer = 0; this.angleOffset = 0;
                } else if (type === 'heavy') {
                    this.color = '#0f0'; this.speed = 40 + Math.random() * 20;
                    this.radius = 18; this.hp = 4; this.score = 500;
                }
            }

            update(dt, px, py) {
                let angle = Math.atan2(py - this.y, px - this.x);
                if (this.type === 'speedy') {
                    this.erraticTimer -= dt;
                    if (this.erraticTimer <= 0) {
                        this.angleOffset = (Math.random() - 0.5) * 1.5;
                        this.erraticTimer = Math.random() * 0.4 + 0.1;
                    }
                    angle += this.angleOffset;
                }
                this.x += Math.cos(angle) * this.speed * dt;
                this.y += Math.sin(angle) * this.speed * dt;
            }

            draw(ctx) {
                ctx.strokeStyle = this.color; ctx.lineWidth = 2.5;
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.save(); ctx.translate(this.x, this.y);
                const t = Date.now() / 200;
                
                ctx.beginPath();
                if (this.type === 'grunt') {
                    ctx.rotate(t); ctx.rect(-this.radius, -this.radius, this.radius*2, this.radius*2);
                } else if (this.type === 'speedy') {
                    ctx.rotate(-t * 2);
                    ctx.moveTo(0, -this.radius); ctx.lineTo(this.radius, this.radius*0.8); ctx.lineTo(-this.radius, this.radius*0.8); ctx.closePath();
                } else if (this.type === 'heavy') {
                    ctx.rotate(t * 0.5);
                    for (let i = 0; i < 6; i++) ctx.lineTo(this.radius * Math.cos(i * Math.PI/3), this.radius * Math.sin(i * Math.PI/3));
                    ctx.closePath();
                    ctx.fillStyle = `rgba(0, 255, 0, ${this.hp/4})`; ctx.fill();
                }
                ctx.stroke(); ctx.restore();
            }

            hit() {
                this.hp--;
                createParticles(this.x, this.y, 4, '#fff', 0.5);
                if (this.hp <= 0) {
                    this.dead = true;
                    createParticles(this.x, this.y, 15, this.color, 1.2);
                    playSound('explosion');
                    return this.score;
                }
                playSound('hit');
                return 0;
            }
        }

        function spawnEnemy() {
            let x, y;
            if (Math.random() < 0.5) { x = Math.random() < 0.5 ? -30 : width + 30; y = Math.random() * height; }
            else { x = Math.random() * width; y = Math.random() < 0.5 ? -30 : height + 30; }

            let type = 'grunt';
            const r = Math.random();
            if (currentWave >= 3 && r < Math.min(0.3, currentWave * 0.03)) type = 'speedy';
            else if (currentWave >= 5 && r > Math.max(0.7, 1.0 - currentWave * 0.02)) type = 'heavy';
            
            enemies.push(new Enemy(type, x, y));
        }

        function startWave() {
            waveActive = true;
            enemiesToSpawn = 10 + (currentWave * 4);
            spawnCooldown = 1.0;
            createParticles(width/2, height/2, 40, '#0f0', 2.5); 
            
            isWaveTransition = true;
            waveTimer = 2.5;
            const waveAnnouncer = document.getElementById('wave-announcement');
            waveAnnouncer.innerText = 'WAVE ' + currentWave;
            waveAnnouncer.style.display = 'block';
            
            playSound('waveStart');
            updateHUD();
        }

        function checkCollisions() {
            // Bullet vs Enemy
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                        const pts = e.hit();
                        if (pts > 0) { score += pts; updateHUD(); }
                        bullets.splice(i, 1);
                        break; 
                    }
                }
            }

            // Player vs Enemy
            if (player.invuln <= 0 && !isRespawning) {
                for (let i = 0; i < enemies.length; i++) {
                    if (Math.hypot(player.x - enemies[i].x, player.y - enemies[i].y) < player.radius + enemies[i].radius - 3) {
                        playerHit(); break;
                    }
                }
            }
        }

        function playerHit() {
            createParticles(player.x, player.y, 40, player.color, 3);
            lives--; updateHUD();
            playSound('playerDeath');
            
            // Push enemies back on hit
            enemies.forEach(e => {
                if (Math.hypot(player.x - e.x, player.y - e.y) < 150) e.hit();
            });

            if (lives <= 0) gameOver();
            else { 
                isRespawning = true;
                respawnTimer = 2.0;
            }
        }

        function updateHUD() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('wave-display').innerText = currentWave;
            document.getElementById('lives-display').innerText = lives;
        }

        function update(dt) {
            if (isWaveTransition) {
                waveTimer -= dt;
                if (waveTimer <= 0) {
                    isWaveTransition = false;
                    document.getElementById('wave-announcement').style.display = 'none';
                }
            }

            if (isRespawning) {
                respawnTimer -= dt;
                if (respawnTimer <= 0) {
                    isRespawning = false;
                    player.x = width / 2; 
                    player.y = height / 2;
                    player.invuln = 2.5;
                }
            }

            if (!isRespawning) {
                player.update(dt);
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update(dt);
                if (bullets[i].life <= 0 || bullets[i].x < 0 || bullets[i].x > width || bullets[i].y < 0 || bullets[i].y > height) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                if (isRespawning) {
                    enemies[i].update(dt, enemies[i].x, enemies[i].y);
                } else {
                    enemies[i].update(dt, player.x, player.y);
                }
                if (enemies[i].dead) enemies.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            checkCollisions();

            if (waveActive && !isWaveTransition) {
                if (enemiesToSpawn > 0) {
                    spawnCooldown -= dt;
                    if (spawnCooldown <= 0) {
                        spawnEnemy(); enemiesToSpawn--;
                        spawnCooldown = Math.max(0.15, 0.8 - (currentWave * 0.05));
                    }
                } else if (enemies.length === 0) {
                    waveActive = false;
                    setTimeout(() => {
                        currentWave++; score += 500 * currentWave; 
                        startWave();
                    }, 1000); // Wait 1s before triggering the new wave transition
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, width, height);

            // Subtle Grid
            ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.beginPath();
            const g = 60;
            const ox = (player ? -player.x * 0.05 : 0) % g;
            const oy = (player ? -player.y * 0.05 : 0) % g;
            for(let x=ox; x<width; x+=g) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
            for(let y=oy; y<height; y+=g) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
            ctx.stroke();

            particles.forEach(p => p.draw(ctx));
            bullets.forEach(b => b.draw(ctx));
            enemies.forEach(e => e.draw(ctx));
            if (player && !isRespawning) player.draw(ctx);

            // Draw Virtual Joysticks
            ['left', 'right'].forEach(side => {
                const s = joysticks[side];
                if (s.active) {
                    ctx.beginPath(); ctx.arc(s.ox, s.oy, MAX_JOY_RADIUS, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = 'rgba(0, 255, 255, 0.05)'; ctx.fill();
                    
                    ctx.beginPath(); ctx.arc(s.ox + s.dx*MAX_JOY_RADIUS, s.oy + s.dy*MAX_JOY_RADIUS, 15, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(0, 255, 255, 0.6)'; ctx.shadowBlur = 10; ctx.shadowColor = '#0ff'; ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
        }

        function gameLoop(timestamp) {
            if (currentState !== STATE.PLAYING) return;
            
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (dt > 0.1) dt = 0.1; // Cap delta to prevent clipping

            update(dt);
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (id) document.getElementById(id).classList.add('active');
        }

        async function startGame() {
            await Tone.start();
            initAudio();

            player = new Player();
            bullets = []; enemies = []; particles = [];
            score = 0; lives = 3; currentWave = 1;
            
            updateHUD();
            document.getElementById('hud').classList.remove('hidden');
            showScreen(null);
            
            currentState = STATE.PLAYING;
            startWave();
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            currentState = STATE.GAMEOVER;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-wave').innerText = currentWave;
            
            document.getElementById('initials-input').value = '';
            document.getElementById('name-entry-section').classList.remove('hidden');
            document.getElementById('submitting-loader').classList.add('hidden');
            
            showScreen('screen-gameover');
            playSound('gameOver');
            setTimeout(() => document.getElementById('initials-input').focus(), 100);
        }

        async function submitScore() {
            const input = document.getElementById('initials-input').value.trim().toUpperCase();
            if (input.length === 0) return;
            const init = input.substring(0, 3) || '???';
            
            document.getElementById('name-entry-section').classList.add('hidden');
            document.getElementById('submitting-loader').classList.remove('hidden');

            await saveHighScore(init, score, currentWave);
            showLeaderboard();
        }

        async function showLeaderboard() {
            currentState = STATE.LEADERBOARD;
            document.getElementById('hud').classList.add('hidden');
            showScreen('screen-leaderboard');
            
            const listEl = document.getElementById('leaderboard-list');
            const loaderEl = document.getElementById('leaderboard-loading');
            
            listEl.innerHTML = '';
            loaderEl.classList.remove('hidden');

            const scores = await fetchHighScores();
            loaderEl.classList.add('hidden');
            
            if (scores.length === 0) {
                listEl.innerHTML = '<li><span style="color:#aaa; width:100%; text-align:center;">NO DATABANK ENTRIES</span></li>';
            } else {
                scores.forEach((entry, idx) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span class="rank">#${idx + 1}</span>
                        <span class="name">${entry.name}</span>
                        <span class="score">${entry.score}</span>
                    `;
                    // Highlight recent run loosely
                    if (entry.score === score && entry.name === document.getElementById('initials-input').value.toUpperCase().substring(0,3)) {
                        li.style.background = 'rgba(0, 255, 255, 0.15)'; li.style.padding = '5px'; li.style.borderRadius = '3px';
                    }
                    listEl.appendChild(li);
                });
            }
        }

        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-show-leaderboard').addEventListener('click', showLeaderboard);
        document.getElementById('btn-back-main').addEventListener('click', () => {
            currentState = STATE.MENU; showScreen('screen-start');
        });
        
        document.getElementById('btn-submit-score').addEventListener('click', submitScore);
        document.getElementById('initials-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitScore();
        });

        // Setup Initial state
        draw(); 
        showScreen('screen-start');

    </script>
</body>
</html>
